<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="referrer" content="no-referrer">
  <link rel="apple-touch-icon" href="ikon.png">
  <link rel="icon" href="ikon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Edison">
  <title>Edison</title>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="preconnect" href="https://a.tile.openstreetmap.org">
  <link rel="preconnect" href="https://b.tile.openstreetmap.org">
  <link rel="preconnect" href="https://c.tile.openstreetmap.org">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <style>
    :root{
      --ink:#0F1E2B;
      --paper:#F3F0E7;
      --delft:#2C5A8C;
      --delft-soft:rgba(44,90,140,.38);
      --oranje:#E4632B;
      --line:rgba(15,30,43,.14);
      --ok:#1F7A5A;
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      color:var(--ink);-webkit-text-size-adjust:100%}
    #map{position:absolute;inset:0}
    #boot{position:absolute;inset:0;z-index:2000;background:var(--ink);
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
      transition:opacity .3s ease}
    #boot.gone{opacity:0;pointer-events:none}
    #boot img{width:88px;height:88px;border-radius:20px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
    #boot p{color:var(--paper);font-size:13px;opacity:.75;margin:0}
    .leaflet-container{background:#dfe6ea;font:inherit}

    /* Toppstripe med status */
    #status{position:absolute;top:0;left:0;right:0;z-index:1000;
      background:var(--ink);color:var(--paper);
      padding:5px 12px 6px;padding-top:calc(5px + env(safe-area-inset-top,0));
      display:flex;gap:10px;align-items:baseline;
      white-space:nowrap;overflow:hidden;font-size:12.5px;line-height:1.4}
    #status b{font-size:15px;font-weight:600;letter-spacing:-.02em}
    #status span{opacity:.75}
    #status #cellTxt{display:none}
    #status #meTxt{display:none}
    #status.big{white-space:normal;flex-wrap:wrap;padding-bottom:9px}
    #status.big b{font-size:19px}
    #status.big #cellTxt{display:inline}
    #status.big .guess{margin-left:auto;text-align:right}

    /* Instruksjonsbanner under toppstripa */
    #hintbar{position:absolute;left:8px;right:8px;z-index:1100;
      background:var(--oranje);color:#fff;border-radius:10px;
      padding:9px 12px;font-size:13.5px;line-height:1.35;display:none;
      box-shadow:0 6px 18px rgba(15,30,43,.25)}
    #hintbar.on{display:block}
    #hintbar button{margin-left:8px;background:rgba(255,255,255,.2);border:0;color:#fff;
      border-radius:7px;padding:5px 10px;font:inherit;font-size:12.5px}

    /* Bunnpanel */
    #sheet{position:absolute;left:0;right:0;bottom:0;z-index:1000;
      background:var(--paper);border-radius:16px 16px 0 0;
      box-shadow:0 -8px 26px rgba(15,30,43,.3);
      max-height:72%;display:flex;flex-direction:column;
      transform:translateY(calc(100% - 62px));transition:transform .22s ease;
      padding-bottom:env(safe-area-inset-bottom,0)}
    #sheet.open{transform:translateY(0)}
    @media (prefers-reduced-motion:reduce){#sheet{transition:none}}
    #gps{padding:10px 16px 0;font-size:12px;line-height:1.4;color:rgba(15,30,43,.62)}
    #gps:empty{display:none}
    #gps button{border:0;background:transparent;padding:2px 0;margin-left:8px;
      font:inherit;font-size:12px;color:var(--delft);text-decoration:underline}
    #grip{padding:12px 16px 11px;display:flex;align-items:center;gap:10px;cursor:pointer;
      border-bottom:1px solid var(--line)}
    #grip .bar{width:34px;height:4px;border-radius:2px;background:rgba(15,30,43,.25)}
    #grip h1{font-size:15px;margin:0;font-weight:600;letter-spacing:-.01em}
    #grip .count{margin-left:auto;font-size:12.5px;color:rgba(15,30,43,.6)}
    #body{overflow:auto;padding:12px 16px 20px;-webkit-overflow-scrolling:touch}

    .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
    button.act{flex:1 1 auto;min-width:104px;border:1px solid var(--ink);background:transparent;
      color:var(--ink);border-radius:9px;padding:11px 10px;font:inherit;font-size:13.5px;font-weight:500}
    button.act.primary{background:var(--ink);color:var(--paper)}
    button.act.warm{background:var(--oranje);border-color:var(--oranje);color:#fff}
    button.act:active{opacity:.7}
    button.tiny{border:1px solid var(--line);background:#fff;border-radius:7px;
      padding:7px 10px;font:inherit;font-size:12.5px;color:var(--ink)}
    button.tiny.sel{background:var(--delft);border-color:var(--delft);color:#fff}

    .card{border:1px solid var(--line);background:#fff;border-radius:11px;padding:12px;margin-bottom:10px}
    .card h2{margin:0 0 8px;font-size:13.5px;font-weight:600}
    .card p{margin:0 0 10px;font-size:12.5px;line-height:1.45;color:rgba(15,30,43,.7)}
    label{display:block;font-size:12.5px;margin-bottom:5px;color:rgba(15,30,43,.7)}
    input[type=number],input[type=text],textarea,select{width:100%;border:1px solid var(--line);
      border-radius:8px;padding:10px;font:inherit;font-size:15px;background:#fff;color:var(--ink)}
    textarea{font-size:11px;height:88px;font-family:ui-monospace,Menlo,Consolas,monospace}

    ul#list{list-style:none;margin:0;padding:0}
    ul#list li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
    ul#list li:last-child{border-bottom:0}
    ul#list .txt{flex:1;font-size:13px;line-height:1.4}
    ul#list .txt small{display:block;color:rgba(15,30,43,.55);font-size:11.5px;margin-top:2px}
    ul#list li.off .txt{opacity:.42;text-decoration:line-through}
    ul#list .del{flex:0 0 auto;align-self:center;color:var(--oranje);border-color:rgba(228,99,43,.45)}
    ul#list .eye{flex:0 0 auto;width:26px;height:26px;border-radius:13px;display:grid;place-items:center;
      font-size:12px;color:#fff;background:var(--delft);align-self:center}
    ul#list li.off .eye{background:transparent;color:rgba(15,30,43,.4);border:1px solid var(--line)}
    ul#list .txt{cursor:pointer}
    .empty{font-size:13px;color:rgba(15,30,43,.6);line-height:1.5;padding:6px 0 2px}

    #ask{position:absolute;inset:0;z-index:1200;display:none;
      background:rgba(15,30,43,.55);align-items:center;justify-content:center;padding:24px}
    #ask.on{display:flex}
    #ask .box{background:var(--paper);border-radius:14px;padding:18px;max-width:340px;width:100%;
      box-shadow:0 12px 40px rgba(15,30,43,.4)}
    #ask p{margin:0 0 14px;font-size:14.5px;line-height:1.45}

    /* Kartknapper */
    .mapbtn{position:absolute;z-index:590;width:44px;height:44px;border-radius:22px;border:0;
      background:var(--paper);color:var(--ink);font-size:19px;
      box-shadow:0 3px 10px rgba(15,30,43,.3)}
    .leaflet-control{z-index:400 !important}
    .leaflet-bottom.leaflet-left{margin-bottom:70px}
    .leaflet-control-attribution{margin-bottom:64px !important;font-size:10px;opacity:.85}
    #locBtn{right:10px;bottom:82px}
    #fitBtn{right:10px;bottom:132px}
  </style>
</head>
<body>
<div id="map"></div>
<div id="boot">
  <img src="ikon.png" alt="">
  <p>Laster kartet …</p>
</div>

<div id="status">
  <b id="areaTxt">—</b>
  <span id="cellTxt">mulig område igjen</span>
  <span class="guess" id="guessTxt"></span>
</div>

<div id="ask">
  <div class="box">
    <p id="askTxt"></p>
    <div class="row" style="margin:0">
      <button class="act" id="askNo">Avbryt</button>
      <button class="act warm" id="askYes">Ja</button>
    </div>
  </div>
</div>

<div id="hintbar"><span id="hintTxt"></span><button id="useMeBtn">Bruk min posisjon</button><button id="cancelBtn">Avbryt</button></div>

<button class="mapbtn" id="locBtn" title="Min posisjon">◎</button>
<button class="mapbtn" id="fitBtn" title="Zoom til området">⤢</button>

<div id="sheet">
  <div id="gps"><span id="meTxt"></span><button id="setMeBtn">Sett posisjon manuelt</button></div>
  <div id="grip">
    <div class="bar"></div>
    <h1>Sperringer</h1>
    <span class="count" id="countTxt">0 aktive</span>
  </div>
  <div id="body">
    <div class="row">
      <button class="act primary" data-add="radar">Avstand</button>
      <button class="act primary" data-add="line">Strek</button>
      <button class="act primary" data-add="tampen">Tampen brenner</button>
      <button class="act primary" data-add="place">Søk kommune/sted</button>
      <button class="act primary" data-add="poly">Tegn område</button>
    </div>

    <div class="card" id="form" style="display:none"></div>

    <div class="row" id="bulkRow" style="display:none">
      <button class="act" id="allOnBtn">Vis alle</button>
      <button class="act" id="allOffBtn">Skjul alle</button>
    </div>
    <ul id="list"></ul>
    <p class="empty" id="emptyTxt">Ingen sperringer ennå. Hvert hint dere kjøper blir en sperring — kartet viser hvor gjemmeteamet fortsatt kan være.</p>

    <div class="row" style="margin-top:14px">
      <button class="act" id="newRoundBtn">Ny gjemming</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  /* ---------- Spillebrettet ---------- */
  const CENTER = {lat:52.055, lon:4.78};
  const RADIUS = 54000;
  const RAD = Math.PI/180;

  function dist(aLat,aLon,bLat,bLon){            // meter, haversine
    const dLat=(bLat-aLat)*RAD, dLon=(bLon-aLon)*RAD;
    const s=Math.sin(dLat/2)**2 + Math.cos(aLat*RAD)*Math.cos(bLat*RAD)*Math.sin(dLon/2)**2;
    return 6371000*2*Math.asin(Math.sqrt(s));
  }

  /* ---------- Rutenett: 800 m grovruter, delt i 100 m der en kant går ---------- */
  const COARSE_KM = 0.8, SUB = 8;          // 8x8 underruter = 100 m
  let rows = [], coarseCount = 0;

  function buildGrid(){
    rows = [];
    let idx = 0;
    const dLat = COARSE_KM/111.32;
    const latSpan = RADIUS/111320 + dLat;
    for(let lat = CENTER.lat-latSpan; lat <= CENTER.lat+latSpan; lat += dLat){
      const k = Math.cos(lat*RAD);
      const dLon = COARSE_KM/(111.32*k);
      const lonSpan = RADIUS/(111320*k) + dLon;
      const n = Math.ceil(2*lonSpan/dLon);
      let first = -1, last = -1;
      for(let i=0;i<n;i++){
        const lon = CENTER.lon - lonSpan + i*dLon;
        if(dist(CENTER.lat, CENTER.lon, lat, lon) <= RADIUS){ if(first<0) first=i; last=i; }
      }
      if(first < 0) continue;
      rows.push({lat, dLat, dLon,
        lon0: CENTER.lon - lonSpan + first*dLon,
        cols: last-first+1, start: idx});
      idx += last-first+1;
    }
    coarseCount = idx;
    if(typeof stateCache !== 'undefined') stateCache.clear();
    yCache = {z:null, top:null, bot:null};
  }

  /* ---------- Sperringer ---------- */
  let constraints = [];   // {id,type,on,...}
  let nextId = 1;

  function inPoly(lat,lon,pts){
    let hit=false;
    for(let i=0,j=pts.length-1;i<pts.length;j=i++){
      const yi=pts[i].lat, xi=pts[i].lon, yj=pts[j].lat, xj=pts[j].lon;
      if(((yi>lat)!==(yj>lat)) && (lon < (xj-xi)*(lat-yi)/(yj-yi)+xi)) hit=!hit;
    }
    return hit;
  }

  /* Grensen deles i vannrette bånd, så et testpunkt bare sjekkes mot
     de hjørnene som faktisk kan krysse dets breddegrad — i stedet for
     å gå gjennom hele grensen for hvert eneste prøvepunkt. */
  function buildRingIndex(rings, bbox, bins){
    bins = bins || 64;
    const span = Math.max(1e-9, bbox.n - bbox.s);
    const h = span / bins;
    const buckets = Array.from({length:bins}, ()=>[]);
    for(const ring of rings){
      for(let i=0,j=ring.length-1;i<ring.length;j=i++){
        const yi=ring[i].lat, xi=ring[i].lon, yj=ring[j].lat, xj=ring[j].lon;
        let b0 = Math.floor((Math.min(yi,yj)-bbox.s)/h);
        let b1 = Math.floor((Math.max(yi,yj)-bbox.s)/h);
        b0 = Math.max(0, Math.min(bins-1, b0));
        b1 = Math.max(0, Math.min(bins-1, b1));
        const edge = [xi,yi,xj,yj];
        for(let b=b0; b<=b1; b++) buckets[b].push(edge);
      }
    }
    return {bbox, bins, h, buckets};
  }

  function inRingsIndexed(lat, lon, idx){
    const b = idx.bbox;
    if(lat < b.s || lat > b.n) return false;
    let bin = Math.floor((lat - b.s)/idx.h);
    if(bin < 0) bin = 0; if(bin >= idx.bins) bin = idx.bins-1;
    let hit = false;
    for(const e of idx.buckets[bin]){
      const xi=e[0], yi=e[1], xj=e[2], yj=e[3];
      if(((yi>lat)!==(yj>lat)) && (lon < (xj-xi)*(lat-yi)/(yj-yi)+xi)) hit=!hit;
    }
    return hit;
  }

  function sideOf(a, b, lat, lon){
    const k = Math.cos(a.lat*RAD);
    const ex = (b.lon-a.lon)*k, ey = b.lat-a.lat;
    const dx = (lon-a.lon)*k,   dy = lat-a.lat;
    return ex*dy - ey*dx;          // positivt = venstre for retningen a→b
  }

  const COMPASS = ['nord','nordøst','øst','sørøst','sør','sørvest','vest','nordvest'];
  function sideName(a, b, left){
    const k = Math.cos(a.lat*RAD);
    let ex = (b.lon-a.lon)*k, ey = b.lat-a.lat;
    const n = left ? {e:-ey, nr:ex} : {e:ey, nr:-ex};
    const deg = (Math.atan2(n.e, n.nr)*180/Math.PI + 360) % 360;
    return COMPASS[Math.round(deg/45) % 8];
  }

  function inRings(lat, lon, rings){
    let hit = false;
    for(const ring of rings){
      for(let i=0,j=ring.length-1;i<ring.length;j=i++){
        const yi=ring[i].lat, xi=ring[i].lon, yj=ring[j].lat, xj=ring[j].lon;
        if(((yi>lat)!==(yj>lat)) && (lon < (xj-xi)*(lat-yi)/(yj-yi)+xi)) hit=!hit;
      }
    }
    return hit;
  }

  function keeps(c, lat, lon){
    if(c.type==='geo'){
      const b = c.bbox;
      if(b && (lat<b.s || lat>b.n || lon<b.w || lon>b.e)) return !c.keep;
      const inside = c.idx ? inRingsIndexed(lat, lon, c.idx) : inRings(lat, lon, c.rings);
      return c.keep ? inside : !inside;
    }
    if(c.type==='closer'){
      const d = dist(c.ref.lat, c.ref.lon, lat, lon);
      return c.closer ? d < c.refDist : d > c.refDist;
    }
    if(c.type==='line'){
      const v = sideOf(c.a, c.b, lat, lon);
      return c.left ? v > 0 : v < 0;
    }
    if(c.type==='radar'){
      const d = dist(c.lat,c.lon,lat,lon);
      return c.inside ? d <= c.dist : d > c.dist;
    }
    if(c.type==='tampen'){
      const dA = dist(c.a.lat,c.a.lon,lat,lon);
      const dB = dist(c.b.lat,c.b.lon,lat,lon);
      return c.warmer ? dB < dA : dB > dA;
    }
    if(c.type==='poly'){
      const b = c.bbox;
      if(b && (lat<b.s || lat>b.n || lon<b.w || lon>b.e)) return !c.keep;
      const inside = c.idx ? inRingsIndexed(lat, lon, c.idx) : inPoly(lat,lon,c.pts);
      return c.keep ? inside : !inside;
    }
    return true;
  }

  function bboxOf(rings){
    let n=-90,s2=90,e=-180,w=180;
    for(const ring of rings) for(const q of ring){
      if(q.lat>n)n=q.lat; if(q.lat<s2)s2=q.lat;
      if(q.lon>e)e=q.lon; if(q.lon<w)w=q.lon;
    }
    return {n,s:s2,e,w};
  }

  /* For hver sperring: 1 = hele grovruta er åpen, 0 = hele er utelukket,
     2 = kanten går tvers gjennom, og da regnes 64 underruter ut. */
  const stateCache = new Map();

  function stateFor(c){
    if(stateCache.has(c.id)) return stateCache.get(c.id);
    if(c.type==='geo' && !c.bbox){ c.bbox = bboxOf(c.rings); c.idx = buildRingIndex(c.rings, c.bbox); }
    if(c.type==='poly' && !c.bbox){ c.bbox = bboxOf([c.pts]); c.idx = buildRingIndex([c.pts], c.bbox); }

    const st = new Uint8Array(coarseCount);
    const sub = new Map();
    for(const r of rows){
      const hLat = r.dLat/2, hLon = r.dLon/2;
      for(let i=0;i<r.cols;i++){
        const lon = r.lon0 + i*r.dLon, idx = r.start + i;
        // ni prøvepunkter: hjørner, kantmidter og senter — nok til å fange en kant
        let yes = 0;
        for(let a=-1;a<=1;a++) for(let b=-1;b<=1;b++)
          if(keeps(c, r.lat + a*hLat, lon + b*hLon)) yes++;
        if(yes === 9){ st[idx] = 1; continue; }
        if(yes === 0){ st[idx] = 0; continue; }
        st[idx] = 2;
        const arr = new Uint8Array(SUB*SUB);
        for(let sy=0; sy<SUB; sy++){
          const slat = r.lat - hLat + (sy+0.5)*r.dLat/SUB;
          for(let sx=0; sx<SUB; sx++){
            const slon = lon - hLon + (sx+0.5)*r.dLon/SUB;
            arr[sy*SUB+sx] = keeps(c, slat, slon) ? 1 : 0;
          }
        }
        sub.set(idx, arr);
      }
    }
    const out = {st, sub};
    stateCache.set(c.id, out);
    return out;
  }

  let coarse = null;              // 0 ute, 1 inne, 2 delvis
  let subAlive = new Map();       // grovindeks -> Uint8Array(64)

  function recompute(){
    const on = constraints.filter(c=>c.on).map(stateFor);
    coarse = new Uint8Array(coarseCount);
    subAlive = new Map();
    const cellArea = COARSE_KM*COARSE_KM, subArea = cellArea/(SUB*SUB);
    let area = 0;

    for(let idx=0; idx<coarseCount; idx++){
      let st = 1, parts = null;
      for(const s of on){
        const v = s.st[idx];
        if(v === 0){ st = 0; break; }
        if(v === 2){ st = 2; (parts || (parts = [])).push(s.sub.get(idx)); }
      }
      if(st === 1){ coarse[idx] = 1; area += cellArea; continue; }
      if(st === 0){ coarse[idx] = 0; continue; }

      const arr = new Uint8Array(SUB*SUB).fill(1);
      for(const p of parts) for(let j=0;j<arr.length;j++) arr[j] &= p[j];
      let n = 0; for(let j=0;j<arr.length;j++) n += arr[j];
      if(n === 0){ coarse[idx] = 0; continue; }
      if(n === arr.length){ coarse[idx] = 1; area += cellArea; continue; }
      coarse[idx] = 2; subAlive.set(idx, arr); area += n*subArea;
    }

    cellLayer.redraw();
    drawShapes();
    save();
    updateStatus(area);
    renderList();
  }

  /* ---------- Husker tilstanden ---------- */
  const KEY = 'gjemsel-peiler-v1';
  let restored = null;

  function save(){
    try{
      localStorage.setItem(KEY, JSON.stringify({
        constraints, me, tampen,
        view: map ? {c:[map.getCenter().lat, map.getCenter().lng], z:map.getZoom()} : null
      }));
    }catch(e){}
  }
  try{ restored = JSON.parse(localStorage.getItem(KEY)); }catch(e){}

  /* ---------- Kart ---------- */
  const map = L.map('map',{zoomControl:false, attributionControl:true})
          .setView([CENTER.lat,CENTER.lon], 9);
  L.control.zoom({position:'bottomleft'}).addTo(map);
  const baseLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19, attribution:'© OpenStreetMap'
  }).addTo(map);
  let bootGone = false;
  function hideBoot(){
    if(bootGone) return; bootGone = true;
    document.getElementById('boot').classList.add('gone');
  }
  baseLayer.on('load', hideBoot);
  setTimeout(hideBoot, 4000);   // ikke la et tregt nett holde skjermen skjult for evig

  L.circle([CENTER.lat,CENTER.lon],{radius:RADIUS,color:'#0F1E2B',weight:2,
    dashArray:'6 5',fill:false}).addTo(map);

  let yCache = {z:null, top:null, bot:null};
  function rowYs(z){
    if(yCache.z === z) return yCache;
    const top = new Float64Array(rows.length), bot = new Float64Array(rows.length);
    for(let i=0;i<rows.length;i++){
      top[i] = map.project([rows[i].lat + rows[i].dLat/2, 0], z).y;
      bot[i] = map.project([rows[i].lat - rows[i].dLat/2, 0], z).y;
    }
    yCache = {z, top, bot};
    return yCache;
  }

  const CellGrid = L.GridLayer.extend({
    createTile(coords){
      const tile = L.DomUtil.create('canvas');
      const size = this.getTileSize();
      tile.width = size.x; tile.height = size.y;
      const ctx = tile.getContext('2d');
      const origin = coords.scaleBy(size);
      const z = coords.z;
      const sx = 256*Math.pow(2,z)/360;
      ctx.fillStyle = 'rgba(15,30,43,.40)';

      if(!rows.length || !coarse) return tile;
      const Y = rowYs(z);
      const last = rows.length-1;

      let lo = 0, hi = last;
      while(lo < hi){ const m=(lo+hi)>>1; if(Y.top[m] > origin.y + size.y) lo=m+1; else hi=m; }

      for(let ri=Math.max(0,lo-1); ri<=last; ri++){
        const r = rows[ri];
        const yT = Math.round(Y.top[ri] - origin.y);
        const yB = Math.round(Y.bot[ri] - origin.y);
        if(yB < 0) break;
        if(yT > size.y) continue;
        const h = Math.max(1, yB - yT);
        const w = r.dLon*sx;
        const lonMin = (origin.x - w)/sx - 180;
        const lonMax = (origin.x + size.x)/sx - 180;
        const i0 = Math.max(0, Math.floor((lonMin - r.lon0)/r.dLon));
        const i1 = Math.min(r.cols-1, Math.ceil((lonMax - r.lon0)/r.dLon));

        let runStart = -1;
        for(let i=i0; i<=i1+1; i++){
          const idx = r.start + i;
          const st = i<=i1 ? coarse[idx] : 1;

          if(st === 0){ if(runStart<0) runStart = i; continue; }

          if(runStart >= 0){                       // tegn sammenhengende utelukket strekk
            const x1 = Math.round((r.lon0 + (runStart-0.5)*r.dLon + 180)*sx - origin.x);
            const x2 = Math.round((r.lon0 + (i-0.5)*r.dLon + 180)*sx - origin.x);
            ctx.fillRect(x1, yT, Math.max(1, x2-x1), h);
            runStart = -1;
          }
          if(st !== 2) continue;

          const arr = subAlive.get(idx);
          if(!arr) continue;
          const x1 = Math.round((r.lon0 + (i-0.5)*r.dLon + 180)*sx - origin.x);
          const x2 = Math.round((r.lon0 + (i+0.5)*r.dLon + 180)*sx - origin.x);
          const cw = x2-x1;

          if(cw < SUB || h < SUB){                 // for smått til å vise underruter
            let dead = 0;
            for(let j=0;j<arr.length;j++) if(!arr[j]) dead++;
            if(dead*2 > arr.length) ctx.fillRect(x1, yT, Math.max(1,cw), h);
            continue;
          }
          const sw = cw/SUB, sh = h/SUB;
          for(let sy=0; sy<SUB; sy++){
            // sy = 0 er sørligst, altså nederst. Kantene rundes likt oppe og nede,
            // så naboruter deler kant og det ikke blir luft mellom dem.
            const pyB = Math.round(yB - sy*sh);
            const pyT = Math.round(yB - (sy+1)*sh);
            let run = -1;
            for(let sxi=0; sxi<=SUB; sxi++){
              const dead = sxi<SUB && !arr[sy*SUB+sxi];
              if(dead && run<0) run = sxi;
              if(!dead && run>=0){
                const ax = Math.round(x1 + run*sw), bx = Math.round(x1 + sxi*sw);
                ctx.fillRect(ax, pyT, Math.max(1, bx-ax), Math.max(1, pyB-pyT));
                run = -1;
              }
            }
          }
        }
      }
      return tile;
    }
  });
  const cellLayer = new CellGrid({tileSize:256, updateWhenZooming:false, updateWhenIdle:true, keepBuffer:1}).addTo(map);

  const dLatB = RADIUS/111320;
  const dLonB = RADIUS/(111320*Math.cos(CENTER.lat*RAD));
  const BOARD = L.latLngBounds(
          [CENTER.lat-dLatB, CENTER.lon-dLonB],
          [CENTER.lat+dLatB, CENTER.lon+dLonB]
  );

  let me = null, meAcc = 0, watchId = null, follow = false;
  const meLayer = L.layerGroup().addTo(map);

  function drawMe(){
    meLayer.clearLayers();
    if(!me) return;
    if(meAcc > 25) L.circle([me.lat,me.lon],{radius:meAcc,color:'#0F1E2B',weight:1,
      fillColor:'#0F1E2B',fillOpacity:.08}).addTo(meLayer);
    L.circleMarker([me.lat,me.lon],{radius:8,color:'#fff',weight:3,
      fillColor:'#0F1E2B',fillOpacity:1}).addTo(meLayer);
  }

  function gpsMsg(t){ document.getElementById('meTxt').textContent = t; }

  function startWatch(){
    if(watchId !== null) return;
    if(!navigator.geolocation){ gpsMsg('Nettleseren har ikke GPS-støtte.'); return; }
    if(!window.isSecureContext){
      gpsMsg('GPS er sperret her: siden må åpnes fra en https-adresse, ikke som lokal fil.');
      return;
    }
    gpsMsg('Slår på GPS …');
    watchId = navigator.geolocation.watchPosition(pos=>{
      me = {lat:+pos.coords.latitude.toFixed(5), lon:+pos.coords.longitude.toFixed(5)};
      meAcc = Math.round(pos.coords.accuracy||0);
      drawMe(); updateMeTxt(); updateTampenBtn();
      if(follow) map.setView([me.lat,me.lon], Math.max(map.getZoom(),13));
    }, err=>{
      navigator.geolocation.clearWatch(watchId); watchId = null;
      if(err.code === 1) gpsMsg('GPS ble avvist. Tillat stedstjenester for denne siden, og trykk ◎ igjen.');
      else if(err.code === 3) gpsMsg('GPS svarte ikke i tide. Trykk ◎ for å prøve på nytt.');
      else gpsMsg('Fant ingen posisjon akkurat nå. Trykk ◎ for å prøve på nytt.');
    }, {enableHighAccuracy:true, maximumAge:5000, timeout:20000});
  }

  function setMe(p){
    me = p; meAcc = 0;
    drawMe(); updateMeTxt(); updateTampenBtn(); updateStatusGuessOnly(); save();
  }

  function updateMeTxt(){
    const el = document.getElementById('meTxt');
    if(!me){ el.textContent = ''; return; }
    el.textContent = 'Du: '+me.lat.toFixed(4)+', '+me.lon.toFixed(4)+
            (meAcc ? ' (±'+meAcc+' m)' : ' (satt for hånd)');
  }

  const shapes = L.layerGroup().addTo(map);
  const scratch = L.layerGroup().addTo(map);
  let guessCircle = null;

  function drawShapes(){
    shapes.clearLayers();
    for(const c of constraints){
      const style = {color:c.on?'#E4632B':'#9aa5ad', weight:1.6, fill:false, dashArray:'4 4'};
      if(c.type==='radar'){
        L.circle([c.lat,c.lon],{radius:c.dist,...style}).addTo(shapes);
        L.circleMarker([c.lat,c.lon],{radius:4,color:style.color,fillOpacity:1}).addTo(shapes);
      }
      if(c.type==='tampen'){
        const tc = c.on ? '#2C5A8C' : '#9aa5ad';   // blå, ikke oransje — så den ikke blandes med Strek
        L.polyline([[c.a.lat,c.a.lon],[c.b.lat,c.b.lon]],{color:tc,weight:2,dashArray:'4 4'}).addTo(shapes);
        L.circleMarker([c.a.lat,c.a.lon],{radius:4,color:tc,fillOpacity:1}).addTo(shapes);
        L.circleMarker([c.b.lat,c.b.lon],{radius:6,color:tc,fillOpacity:.35}).addTo(shapes);
      }
      if(c.type==='geo'){
        for(const ring of c.rings)
          L.polygon(ring.map(q=>[q.lat,q.lon]),{...style,dashArray:null}).addTo(shapes);
      }
      if(c.type==='closer'){
        L.circle([c.ref.lat,c.ref.lon],{radius:c.refDist,...style}).addTo(shapes);
        L.circleMarker([c.ref.lat,c.ref.lon],{radius:4,color:style.color,fillOpacity:1}).addTo(shapes);
      }
      if(c.type==='line'){
        // Mange punkter langs linjen, ikke bare de to ytterpunktene — ellers
        // kutter Leaflet rett strek i skjermpiksler mellom to fjerne punkter,
        // og den rette streken i kartprojeksjonen bommer på de faktiske
        // GPS-punktene et sted i midten.
        const dLat = c.b.lat-c.a.lat, dLon = c.b.lon-c.a.lon;
        const f = 8, N = 24;
        const path = [];
        for(let i=0;i<=N;i++){
          const t = -f + (1+2*f)*(i/N);
          path.push([c.a.lat + t*dLat, c.a.lon + t*dLon]);
        }
        L.polyline(path, {color:style.color, weight:3}).addTo(shapes);
        L.circleMarker([c.a.lat,c.a.lon],{radius:4,color:style.color,fillOpacity:1}).addTo(shapes);
        L.circleMarker([c.b.lat,c.b.lon],{radius:4,color:style.color,fillOpacity:1}).addTo(shapes);
      }
      if(c.type==='poly'){
        L.polygon(c.pts.map(p=>[p.lat,p.lon]),{...style,fill:false}).addTo(shapes);
      }
    }
  }

  /* ---------- Status og gjett-forslag ---------- */
  function updateStatus(area){
    document.getElementById('areaTxt').textContent =
            area<=0 ? 'Ingen treff'
                    : (area>=100 ? Math.round(area)+' km²' : area.toFixed(2)+' km²');
    document.getElementById('cellTxt').textContent =
            area<=0 ? 'sperringene motsier hverandre' : 'åpent — skygge er utelukket';

    if(guessCircle){ map.removeLayer(guessCircle); guessCircle=null; }
    if(area<=0){ guessInfo=null; renderGuess(); return; }

    let sLat=0, sLon=0, w=0;
    const pts = [];
    for(const row of rows){
      for(let i=0;i<row.cols;i++){
        const idx = row.start+i, st = coarse[idx];
        if(!st) continue;
        const lon = row.lon0 + i*row.dLon;
        if(st === 1){
          sLat += row.lat*64; sLon += lon*64; w += 64;
          pts.push([row.lat, lon, COARSE_KM*707]);
        }else{
          const arr = subAlive.get(idx);
          if(!arr) continue;
          for(let sy=0; sy<SUB; sy++){
            const slat = row.lat - row.dLat/2 + (sy+0.5)*row.dLat/SUB;
            for(let sxi=0; sxi<SUB; sxi++){
              if(!arr[sy*SUB+sxi]) continue;
              const slon = lon - row.dLon/2 + (sxi+0.5)*row.dLon/SUB;
              sLat += slat; sLon += slon; w++;
              pts.push([slat, slon, 71]);
            }
          }
        }
      }
    }
    if(!w){ guessInfo=null; renderGuess(); return; }

    const cLat = sLat/w, cLon = sLon/w;
    let r = 0;
    for(const q of pts){
      const d = dist(cLat, cLon, q[0], q[1]) + q[2];
      if(d > r) r = d;
    }
    guessInfo = {lat:cLat, lon:cLon, r};
    renderGuess();
  }

  let guessInfo = null;
  function renderGuess(){
    const g = document.getElementById('guessTxt');
    const big = document.getElementById('status').classList.contains('big');
    if(!guessInfo){ g.textContent=''; return; }
    const {lat,lon,r} = guessInfo;
    if(!big){ g.textContent = '± '+(r/1000).toFixed(1)+' km'; return; }
    const away = me ? '<br>'+(dist(me.lat,me.lon,lat,lon)/1000).toFixed(1)+' km fra deg' : '';
    g.innerHTML = 'Gjett: '+lat.toFixed(4)+', '+lon.toFixed(4)+
            '<br>usikkerhet ≈ '+(r/1000).toFixed(1)+' km'+away;
  }

  let statusTimer = null;
  document.getElementById('status').onclick = ()=>{
    const el = document.getElementById('status');
    el.classList.toggle('big');
    renderGuess(); positionHintbar();
    clearTimeout(statusTimer);
    if(el.classList.contains('big')) statusTimer = setTimeout(()=>{
      el.classList.remove('big'); renderGuess(); positionHintbar();
    }, 8000);
  };

  function updateStatusGuessOnly(){ recompute(); }

  /* ---------- Skjema for nye sperringer ---------- */
  const form = document.getElementById('form');
  const hintbar = document.getElementById('hintbar');
  const hintTxt = document.getElementById('hintTxt');
  let pick = null;   // {need, pts, onDone}

  function positionHintbar(){
    hintbar.style.top = (document.getElementById('status').offsetHeight + 8) + 'px';

  window.addEventListener('resize', positionHintbar);

  function startPick(need, msg, onDone){
    pick = {need, pts:[], onDone, msg};
    hintTxt.textContent = msg;
    hintbar.classList.add('on');
    positionHintbar();
    sheet.classList.remove('open');
  }
  function endPick(){
    pick=null; hintbar.classList.remove('on'); scratch.clearLayers();

  document.getElementById('cancelBtn').onclick = ()=>{ endPick(); form.style.display='none'; };

  function addPoint(p){
    if(!pick) return;
    pick.pts.push(p);
    L.circleMarker([p.lat,p.lon],{radius:5,color:'#E4632B',fillOpacity:1}).addTo(scratch);
    if(pick.need==='poly'){
      if(pick.pts.length>1) L.polyline(pick.pts.map(q=>[q.lat,q.lon]),{color:'#E4632B',weight:2}).addTo(scratch);
      hintTxt.textContent = pick.pts.length+' punkter satt. Trykk «Ferdig» når området er tegnet.';
      return;
    }
    if(pick.pts.length >= pick.need){ const pts=pick.pts; endPick(); pick0(pts); }
    else hintTxt.textContent = pick.msg2 || pick.msg;
  }

  map.on('click', e => addPoint({lat:+e.latlng.lat.toFixed(5), lon:+e.latlng.lng.toFixed(5)}));

    startWatch();

  };

  /* Avstand (Raadar, Tentakels 2 km, Fotografij 5 km) */

      <div class="row" style="margin:9px 0 12px">

          openSheet();
        };

      };
      const ib=form.querySelector('#inBtn'), ob=form.querySelector('#outBtn');

  /* Tampen brenner — start der hintet kjøpes, stopp der det aktiveres */
  let tampen = null;
  const tampenLayer = L.layerGroup().addTo(map);

  function tampenBtn(){ return document.querySelector('[data-add="tampen"]'); }

  function updateTampenBtn(){
    const b = tampenBtn();
    if(!b) return;
    if(!tampen){ b.textContent = 'Tampen brenner'; b.classList.remove('warm'); return; }
    b.classList.add('warm');

                    : 'Sett posisjonen din for å se hvor langt dere har flyttet dere.';

  function drawTampen(){
    tampenLayer.clearLayers();
    if(!tampen) return;
    L.circleMarker([tampen.a.lat,tampen.a.lon],{radius:7,color:'#E4632B',weight:3,

  function tampenCard(){

  /* Henter et punkt: bruker posisjonen din hvis den finnes, ellers et trykk på kartet */
  function pointFrom(msg, cb){
    pick0 = pts => cb(pts[0]);
    startPick(1, msg);
  }

  function finishTampen(a, b){
    if(dist(a.lat,a.lon,b.lat,b.lon) < 30){
      tell('Punktene ligger for tett. Dere må ha flyttet dere for at svaret skal bety noe.');
      return;
    }
    form.style.display='block';
    form.innerHTML = `
    <h2>Ble det varmere?</h2>
    <p>Det er ${(dist(a.lat,a.lon,b.lat,b.lon)/1000).toFixed(2)} km mellom punktene.</p>
    <div class="row" style="margin-bottom:12px">
      <button class="tiny sel" id="wBtn">Varmere</button>
      <button class="tiny" id="cBtn">Kaldere</button>
    </div>
    <div class="row"><button class="act warm" id="okBtn">Legg til sperring</button></div>`;
    let warmer = true;
    const wb=form.querySelector('#wBtn'), cb=form.querySelector('#cBtn');
    wb.onclick=()=>{warmer=true;wb.classList.add('sel');cb.classList.remove('sel')};
    cb.onclick=()=>{warmer=false;cb.classList.add('sel');wb.classList.remove('sel')};
    const okBtn = form.querySelector('#okBtn');
    okBtn.onclick=()=>{
      if(okBtn.disabled) return;
      okBtn.disabled = true;
      constraints.push({id:nextId++,type:'tampen',on:true,a,b,warmer});
      tampen = null; drawTampen(); tampenCard(); updateTampenBtn(); save();
      form.style.display='none'; recompute();
    };
    openSheet();
  }

  function addTampen(){
    form.style.display='none';

    if(tampen){                                  // klokka går — dette er stoppet
      pointFrom('Hvor aktiverte dere hintet? Bruk min posisjon, eller trykk stedet på kartet.',
              b => finishTampen(tampen.a, b));

    }

    form.style.display='block';
    form.innerHTML = `
    <h2>Tampen brenner</h2>

    <div class="row" style="margin:0">
      <button class="act warm" id="startB">Start her</button>
      <button class="act" id="bothB">Marker begge punktene</button>
    </div>`;
    openSheet();

    form.querySelector('#startB').onclick = ()=>{
      form.style.display='none';
      pointFrom('Hvor kjøpte dere hintet? Bruk min posisjon, eller trykk stedet på kartet.', p=>{

        drawTampen(); tampenCard(); updateTampenBtn(); save(); openSheet();
      });
    };

    form.querySelector('#bothB').onclick = ()=>{
      form.style.display='none';
      pick0 = pts => finishTampen(pts[0], pts[1]);
      startPick(2,'Marker der hintet ble kjøpt. Bruk min posisjon, eller trykk på kartet.');
      pick.msg2 = 'Marker der hintet ble aktivert.';
    };

  /* Søk opp kommune, by eller sted i kartdataene */
  function thinRing(coords){
    const out = []; let last = null;
    for(const [lon, lat] of coords){
      if(!last || dist(last.lat, last.lon, lat, lon) > 120){ out.push({lat,lon}); last = {lat,lon}; }
    }
    return out.length >= 3 ? out : null;
  }
  function ringsOf(gj){
    if(!gj) return null;
    const polys = gj.type === 'Polygon' ? [gj.coordinates]
            : gj.type === 'MultiPolygon' ? gj.coordinates : null;
    if(!polys) return null;
    const rings = [];
    for(const poly of polys) for(const ring of poly){
      const t = thinRing(ring); if(t) rings.push(t);
    }
    return rings.length ? rings : null;
  }

  /* Raskt, feiltolerant søk først. Grensen hentes bare for treffet dere velger. */
  async function searchPlaces(q){
    const url = 'https://photon.komoot.io/api/?limit=8&lat='+CENTER.lat+'&lon='+CENTER.lon+
            '&q='+encodeURIComponent(q);
    const r = await fetch(url);
    if(!r.ok) throw new Error('søket svarte '+r.status);
    const d = await r.json();
    const list = (d.features||[]).map(f=>({
      name: f.properties.name,
      where: [f.properties.city, f.properties.county, f.properties.state, f.properties.country]
              .filter(Boolean).join(', '),
      cc: f.properties.countrycode,
      osm: (f.properties.osm_type||'') + (f.properties.osm_id||''),
      lat: f.geometry.coordinates[1],
      lon: f.geometry.coordinates[0]
    })).filter(x=>x.name);
    const nl = list.filter(x=>x.cc==='NL');
    return nl.length ? nl : list;
  }

  async function fetchRings(osm){
    if(!osm || !/^[NWR]\d+$/.test(osm)) return null;
    const r = await fetch('https://nominatim.openstreetmap.org/lookup?format=jsonv2'+
            '&polygon_geojson=1&polygon_threshold=0.0025&osm_ids='+osm);
    if(!r.ok) return null;
    const d = await r.json();
    return d.length ? ringsOf(d[0].geojson) : null;
  }

  function addPlace(){
    form.style.display = 'block';
    form.innerHTML = `
    <h2>Søk opp et sted</h2>
    <p>Kommune, by, flyplass eller landemerke. Skrivefeil går som regel bra.</p>
    <input type="text" id="q" placeholder="f.eks. Gouda, Schiphol, Alphen aan den Rijn">
    <div class="row" style="margin:10px 0 0">
      <button class="act warm" id="goBtn">Søk</button>
      <button class="act" id="mapBtn">Velg punkt på kartet</button>
    </div>
    <div id="res"></div>`;
    openSheet();
    const res = form.querySelector('#res');

    form.querySelector('#mapBtn').onclick = ()=>{
      pick0 = pts => choosePlace({name:'punktet', where:'', osm:null,
        lat:pts[0].lat, lon:pts[0].lon});
      startPick(1,'Trykk stedet hintet handler om.');
    };

    const run = async ()=>{
      const q = form.querySelector('#q').value.trim();
      if(!q) return;
      res.innerHTML = '<p style="margin-top:12px">Søker …</p>';
      try{
        const list = await searchPlaces(q);
        if(!list.length){ res.innerHTML = '<p style="margin-top:12px">Ingen treff. Prøv et annet navn.</p>'; return; }
        res.innerHTML = '<p style="margin:14px 0 8px">Velg riktig treff:</p>';
        for(const it of list){
          const b = document.createElement('button');
          b.className = 'tiny';
          b.style.cssText = 'display:block;width:100%;text-align:left;margin-bottom:6px';
          b.innerHTML = it.name + (it.where ? '<br><span style="opacity:.6">'+it.where+'</span>' : '');
          b.onclick = ()=>choosePlace(it);
          res.appendChild(b);
        }
      }catch(e){
        res.innerHTML = '<p style="margin-top:12px">Søket nådde ikke fram ('+(e.message||'ingen forbindelse')+
                '). Velg punkt på kartet i stedet, eller tegn området for hånd.</p>';
      }
    };

    form.querySelector('#goBtn').onclick = run;
    form.querySelector('#q').addEventListener('keydown', e=>{ if(e.key==='Enter') run(); });
  }

  function choosePlace(it, from){
    const ref = {lat:+it.lat, lon:+it.lon};
    const name = it.name;
    const us = from || me;                       // der vi sto da hintet ble kjøpt
    const usDist = us ? dist(us.lat, us.lon, ref.lat, ref.lon) : null;

    form.style.display = 'block';
    form.innerHTML = `
    <h2>${name}</h2>
    <p>Zamenlijken: hvem er nærmest?</p>
    <div class="row" style="margin-bottom:6px">
      ${usDist ? '<button class="tiny" id="nearB">De er nærmere</button><button class="tiny" id="farB">Vi er nærmere</button>'
            : '<button class="tiny" id="whereB">Marker hvor vi sto</button>'}
    </div>
    <p style="margin:0 0 14px;font-size:12px">
      ${usDist ? 'Vi var '+(usDist/1000).toFixed(1)+' km unna. '
            +'<a href="#" id="otherA" style="color:var(--delft)">Vi sto et annet sted</a>'
            : 'Trykk der dere sto da hintet ble kjøpt, så regner appen ut resten.'}
    </p>
    <p id="areaP">Matchen: henter grense …</p>
    <div class="row" id="areaRow" style="margin:0"></div>`;
    openSheet();

    const markUs = ()=>{
      pick0 = pts => choosePlace(it, pts[0]);
      startPick(1,'Hvor sto dere da hintet ble kjøpt? Bruk min posisjon, eller trykk på kartet.');
    };
    if(!usDist) form.querySelector('#whereB').onclick = markUs;
    else form.querySelector('#otherA').onclick = e => { e.preventDefault(); markUs(); };

    const add = c => { constraints.push({id:nextId++, on:true, name, ...c}); form.style.display='none'; recompute(); };
    if(usDist){
      form.querySelector('#nearB').onclick = ()=>add({type:'closer', ref, refDist:usDist, closer:true});
      form.querySelector('#farB').onclick  = ()=>add({type:'closer', ref, refDist:usDist, closer:false});
    }

    fetchRings(it.osm).then(rings=>{
      const p = form.querySelector('#areaP'), row = form.querySelector('#areaRow');
      if(!p || !row) return;
      if(!rings){ p.textContent = 'Stedet har ingen grense i kartdataene — bruk avstand, eller tegn området for hånd.'; return; }
      p.textContent = 'Matchen: er gjemmeteamet i dette området?';
      row.innerHTML = '<button class="tiny" id="inB">De er her</button><button class="tiny" id="outB">De er ikke her</button>';
      row.querySelector('#inB').onclick  = ()=>add({type:'geo', rings, keep:true});
      row.querySelector('#outB').onclick = ()=>add({type:'geo', rings, keep:false});
    }).catch(()=>{
      const p = form.querySelector('#areaP');
      if(p) p.textContent = 'Fikk ikke hentet grensen. Bruk avstand, eller tegn området for hånd.';
    });
  }

  /* Strek — del brettet i to og velg siden gjemmeteamet er på */
  function addLine(){
    form.style.display='none';
    pick0 = pts => {
      const [a, b] = pts;
      const vName = sideName(a,b,true), hName = sideName(a,b,false);
      form.style.display='block';
      form.innerHTML = `
      <h2>Hvilken side er de på?</h2>
      <p>Streken forlenges i begge retninger over hele brettet. Bruk den til elver, motorveier, jernbane eller en grense dere resonnerer dere fram til.</p>
      <div class="row" style="margin-bottom:12px">
        <button class="tiny sel" id="lBtn">${vName} for streken</button>
        <button class="tiny" id="rBtn">${hName} for streken</button>
      </div>
      <div class="row"><button class="act warm" id="okBtn">Legg til sperring</button></div>`;
      let left = true;
      const lb=form.querySelector('#lBtn'), rb=form.querySelector('#rBtn');
      lb.onclick=()=>{left=true;lb.classList.add('sel');rb.classList.remove('sel')};
      rb.onclick=()=>{left=false;rb.classList.add('sel');lb.classList.remove('sel')};
      const okBtn = form.querySelector('#okBtn');
      okBtn.onclick=()=>{
        if(okBtn.disabled) return;
        okBtn.disabled = true;
        constraints.push({id:nextId++,type:'line',on:true,a,b,left});
        form.style.display='none'; recompute();
      };
      openSheet();
    };
    startPick(2,'Trykk det første punktet streken skal gå gjennom, eller bruk min posisjon.');
    pick.msg2 = 'Trykk det andre punktet på streken.';
  }

  /* Tegnet område — for Matchen, Zamenlijken og alt annet dere resonnerer dere fram til */
  function addPoly(){
    form.style.display='none';
    startPick('poly','Trykk rundt området på kartet. Minst tre punkter.');
    const old = document.getElementById('doneBtn');
    if(old) old.remove();
    const done = document.createElement('button');
    done.id = 'doneBtn';
    done.textContent = 'Ferdig';
    done.onclick = ()=>{
      if(!pick || pick.pts.length<3) return;
      const pts = pick.pts; endPick();
      form.style.display='block';
      form.innerHTML = `
      <h2>Tegnet område</h2>
      <p>Bruk dette til Matchen og Zamenlijken: tegn f.eks. kommunen dere er i, eller kyststripa som er nærmere kysten enn dere.</p>
      <div class="row" style="margin-bottom:12px">
        <button class="tiny sel" id="kBtn">Gjemmeteamet er her</button>
        <button class="tiny" id="eBtn">Ikke her</button>
      </div>
      <div class="row"><button class="act warm" id="okBtn">Legg til sperring</button></div>`;
      let keep = true;
      const kb=form.querySelector('#kBtn'), eb=form.querySelector('#eBtn');
      kb.onclick=()=>{keep=true;kb.classList.add('sel');eb.classList.remove('sel')};
      eb.onclick=()=>{keep=false;eb.classList.add('sel');kb.classList.remove('sel')};
      const okBtn = form.querySelector('#okBtn');
      okBtn.onclick=()=>{
        if(okBtn.disabled) return;
        okBtn.disabled = true;
        constraints.push({id:nextId++,type:'poly',on:true,pts,keep});
        form.style.display='none'; recompute();
      };
      done.remove();
      openSheet();
    };
    hintbar.appendChild(done);
  }

  document.querySelectorAll('[data-add]').forEach(b=>{
    b.onclick = ()=>({radar:addRadar,line:addLine,tampen:addTampen,poly:addPoly,place:addPlace})[b.dataset.add]();
  });

  /* ---------- Listen ---------- */
  function label(c){
    if(c.type==='radar') return (c.inside?'Innenfor ':'Utenfor ')+(c.dist/1000).toFixed(1)+' km';
    if(c.type==='tampen') return c.warmer?'Tampen brenner: varmere':'Tampen brenner: kaldere';
    if(c.type==='geo') return (c.keep?'I ':'Ikke i ')+c.name;
    if(c.type==='closer') return (c.closer?'Nærmere ':'Lenger fra ')+c.name+' enn oss';
    if(c.type==='line') return 'Streken: '+sideName(c.a,c.b,c.left)+' for den';
    if(c.type==='poly') return c.keep?'Innenfor tegnet område':'Utenfor tegnet område';
  }
  function sub(c){
    if(c.type==='radar') return 'fra '+c.lat.toFixed(4)+', '+c.lon.toFixed(4);
    if(c.type==='tampen') return 'flyttet '+(dist(c.a.lat,c.a.lon,c.b.lat,c.b.lon)/1000).toFixed(1)+' km · '
            +c.a.lat.toFixed(4)+','+c.a.lon.toFixed(4)+' → '+c.b.lat.toFixed(4)+','+c.b.lon.toFixed(4);
    if(c.type==='geo') return 'område hentet fra kartdata';
    if(c.type==='closer') return 'vi var '+(c.refDist/1000).toFixed(1)+' km unna';
    if(c.type==='line') return 'gjennom '+c.a.lat.toFixed(4)+','+c.a.lon.toFixed(4)+' og '
            +c.b.lat.toFixed(4)+','+c.b.lon.toFixed(4);
    if(c.type==='poly') return c.pts.length+' hjørner';
  }
  function renderList(){
    const ul=document.getElementById('list');
    ul.innerHTML='';
    for(const c of constraints){
      const li=document.createElement('li');
      if(!c.on) li.className='off';
      li.innerHTML = `<span class="eye">${c.on?'●':'○'}</span>
      <div class="txt">${label(c)}<small>${c.on?sub(c):'skjult — teller ikke med'}</small></div>
      <button class="tiny del">Fjern</button>`;
      li.querySelector('.txt').onclick = () => { c.on = !c.on; recompute(); };
      li.querySelector('.eye').onclick = () => { c.on = !c.on; recompute(); };
      li.querySelector('.del').onclick = () => {
        ask('Fjerne «'+label(c)+'»?', ()=>{
          stateCache.delete(c.id);
          constraints = constraints.filter(x => x !== c);
          recompute();
        });
      };
      ul.appendChild(li);
    }
    document.getElementById('emptyTxt').style.display = constraints.length? 'none':'block';
    document.getElementById('bulkRow').style.display = constraints.length>1 ? 'flex':'none';
    document.getElementById('countTxt').textContent = constraints.filter(c=>c.on).length+' aktive';
  }

  function ask(text, onYes){
    const el = document.getElementById('ask');
    document.getElementById('askTxt').textContent = text;
    el.classList.add('on');
    const close = ()=>{ el.classList.remove('on'); };
    document.getElementById('askNo').onclick = close;
    document.getElementById('askYes').onclick = ()=>{ close(); onYes(); };
  }

  function tell(text){
    const el = document.getElementById('ask');
    document.getElementById('askTxt').textContent = text;
    el.classList.add('on');
    document.getElementById('askYes').textContent = 'Greit';
    document.getElementById('askNo').style.display = 'none';
    document.getElementById('askYes').onclick = ()=>{
      el.classList.remove('on');
      document.getElementById('askYes').textContent = 'Ja';
      document.getElementById('askNo').style.display = '';
    };
  }

  /* ---------- Panel, posisjon, oppløsning ---------- */
  const sheet=document.getElementById('sheet');
  document.getElementById('grip').onclick=()=>sheet.classList.toggle('open');

  const locBtn = document.getElementById('locBtn');
  locBtn.onclick=()=>{
    if(watchId === null){ startWatch(); follow = true; }
    else follow = !follow;
    locBtn.style.background = follow ? '#0F1E2B' : '';
    locBtn.style.color = follow ? '#F3F0E7' : '';
    if(follow && me) map.setView([me.lat,me.lon], Math.max(map.getZoom(),13));
  };
  map.on('dragstart', ()=>{ if(follow){ follow=false; locBtn.style.background=''; locBtn.style.color=''; } });
  document.getElementById('fitBtn').onclick=()=>{
    map.fitBounds(BOARD,{padding:[20,20]});
  };

  document.getElementById('setMeBtn').onclick=()=>{
    pick0 = pts => setMe(pts[0]);
    startPick(1,'Trykk der dere står nå.');
  };

  /* ---------- Lagre / hente ---------- */
  const ARCHIVE = 'gjemsel-peiler-arkiv';
  document.getElementById('newRoundBtn').onclick=()=>{
    if(!constraints.length && !tampen){ tell('Brettet er allerede blankt.'); return; }
    ask('Starte ny gjemming? ' + constraints.length + ' sperringer fjernes fra brettet.', ()=>{
      try{
        const a = JSON.parse(localStorage.getItem(ARCHIVE) || '[]');
        a.push({avsluttet:new Date().toISOString(), constraints});
        localStorage.setItem(ARCHIVE, JSON.stringify(a));
      }catch(e){}
      constraints = []; tampen = null;
      drawTampen(); tampenCard(); updateTampenBtn(); recompute();
    });
  };

  document.getElementById('allOnBtn').onclick=()=>{ constraints.forEach(c=>c.on=true); recompute(); };
  document.getElementById('allOffBtn').onclick=()=>{ constraints.forEach(c=>c.on=false); recompute(); };

  /* ---------- Start ---------- */
  let startZoom = true;
  if(restored){
    if(Array.isArray(restored.constraints)) constraints = restored.constraints;
    nextId = Math.max(0, ...constraints.map(c=>c.id||0)) + 1;
    if(restored.me) me = restored.me;
    if(restored.tampen) tampen = restored.tampen;
  }
  buildGrid();
  recompute();
  drawMe(); updateMeTxt(); drawTampen(); tampenCard(); updateTampenBtn();
  startWatch();
  if(restored && restored.view){
    map.setView(restored.view.c, restored.view.z);
    startZoom = false;
  }
  if(startZoom) map.fitBounds(BOARD,{padding:[20,20]});
  map.on('moveend', save);
  positionHintbar();
</script>
</body>
</html>
